name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set the git user for the tests
        run: |
          git config --global user.name "draupnir CI"
          git config --global user.email "draupnir-ci@example.com"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest

      - name: Install bats and its libraries
        run: |
          sudo mkdir -p /usr/local/lib/bats
          for library in bats-support bats-assert bats-file; do
            sudo git clone --depth 1 --quiet \
              "https://github.com/bats-core/$library.git" "/usr/local/lib/bats/$library"
          done
          git clone --depth 1 --quiet \
            https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
          sudo "$RUNNER_TEMP/bats-core/install.sh" /usr/local

      - name: Integration test
        run: bats bats/

      - name: Build the wheel
        run: uv build

      - name: Install the wheel into a fresh tool environment
        run: |
          uv tool install dist/*.whl
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Run the installed command
        run: draupnir --version
